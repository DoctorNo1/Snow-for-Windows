name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test the simulation
        run: go test ./...
      - name: Vet for Windows
        run: GOOS=windows go vet ./...
      - name: Build SnowForWindows.exe
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/SnowForWindows.exe .
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/SnowForWindows-arm64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: SnowForWindows
          path: dist/*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
